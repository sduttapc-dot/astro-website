<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register | AstroVedic - Acharya Abhijit Das</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #ff8c00;
      --bg-secondary: #fff3e0;
      --text-red: #8b0000;
      --border-orange: #ffaa55;
      --accent-gold: #ffd700;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-secondary);
      color: var(--text-red);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-container {
      background: #ffffff;
      border: 2px solid var(--border-orange);
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(255, 140, 0, 0.15);
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid #ffe0b2;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 10px;
      font-size: 15px;
      font-weight: 800;
      color: #777;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      color: var(--text-red);
      border-bottom: 3px solid var(--bg-primary);
    }

    .form-box {
      display: none;
    }

    .form-box.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-red);
      margin-bottom: 5px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-orange);
      border-radius: 6px;
      font-size: 13.5px;
    }

    .password-hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--bg-primary), #d84315);
      color: #fff;
      border: none;
      width: 100%;
      padding: 11px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255,140,0,0.3);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--text-red);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form (Email or Phone) -->
    <div id="loginFormBox" class="form-box active">
      <h2 style="margin-bottom: 15px; font-size: 18px; color: var(--text-red);">Client Login</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address or Phone Number</label>
          <input type="text" id="logInput" placeholder="Enter email or mobile number" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="logPass" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-submit">Login to Account</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="registerFormBox" class="form-box">
      <h2 style="margin-bottom: 15px; font-size: 18px; color: var(--text-red);">Create Account</h2>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="Enter email" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="10-digit mobile number" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" placeholder="Create password" required>
          <div class="password-hint">8-16 chars, include letters, numbers & special characters (e.g., Abc@1234).</div>
        </div>
        <button type="submit" class="btn-submit">Register Account</button>
      </form>
    </div>

    <a href="consult.html" class="back-home">&larr; Back to Consultation Page</a>
  </div>

  <script>
    function switchTab(tab) {
      const loginBox = document.getElementById('loginFormBox');
      const regBox = document.getElementById('registerFormBox');
      const btns = document.querySelectorAll('.tab-btn');

      btns.forEach(b => b.classList.remove('active'));

      if (tab === 'login') {
        loginBox.classList.add('active');
        regBox.classList.remove('active');
        btns[0].classList.add('active');
      } else {
        regBox.classList.add('active');
        loginBox.classList.remove('active');
        btns[1].classList.add('active');
      }
    }

    // Register Form Handler with Strict Password Validation
    async function handleRegister(event) {
      event.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPass').value.trim();

      const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,16}$/;
      
      if (!passwordRegex.test(password)) {
        alert('Password must be 8-16 characters long and contain at least one letter, one number, and one special character (e.g., Abc@1234)!');
        return;
      }

      try {
        const response = await fetch('http://localhost:5000/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await response.json();

        if (data.success) {
          alert('Registration successful! Please login.');
          switchTab('login');
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        console.error(err);
        alert('Server connection error. Make sure backend is running.');
      }
    }

    // Login Form Handler (Email or Phone)
    async function handleLogin(event) {
      event.preventDefault();
      const loginId = document.getElementById('logInput').value.trim();
      const password = document.getElementById('logPass').value.trim();

      try {
        const response = await fetch('http://localhost:5000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('astro_logged_client', JSON.stringify(data.user));
          alert('Login successful!');
          window.location.href = 'dashboard.html';
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        console.error(err);
        alert('Server connection error. Make sure backend is running.');
      }
    }
  </script>
</body>
</html>
