<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Vedic Astro & Vastu</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #ff8c00;
      --bg-secondary: #fff3e0;
      --text-red: #8b0000;
      --border-orange: #ffaa55;
      --accent-gold: #ffd700;
      --navbar-bg: #7a0000;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-secondary); color: var(--text-red); line-height: 1.6; }
    .container { width: 98%; max-width: 1380px; margin: 0 auto; padding: 0 8px; }

    /* NAVBAR */
    .navbar { background: var(--navbar-bg); position: sticky; top: 0; z-index: 10000; border-bottom: 3px solid var(--bg-primary); padding: 5px 0; box-shadow: 0 4px 15px rgba(122, 0, 0, 0.25); }
    .nav-flex { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .logo-link { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo-img { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--accent-gold); object-fit: cover; background: #000; }
    .logo-text { font-size: 16px; font-weight: 800; color: #ffffff; }
    .logo-text span { color: var(--accent-gold); }
    .nav-links { list-style: none; display: flex; align-items: center; gap: 6px; }
    .nav-links a { text-decoration: none; color: #ffe6e6; font-size: 11.5px; font-weight: 600; padding: 5px 6px; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent-gold); }
    .btn-book { background: linear-gradient(135deg, var(--bg-primary), #d84315) !important; color: #ffffff !important; padding: 4px 9px !important; border-radius: 5px; font-weight: 700 !important; }

    /* AUTH CONTAINER */
    .auth-wrapper { max-width: 500px; margin: 40px auto; padding: 30px; background: #ffffff; border-radius: 12px; box-shadow: 0 6px 20px rgba(255, 140, 0, 0.15); border-top: 5px solid var(--text-red); }
    .auth-wrapper h2 { text-align: center; color: var(--text-red); margin-bottom: 20px; font-size: 22px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #444; }
    input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--text-red); }
    .auth-btn { width: 100%; padding: 12px; background: var(--text-red); color: #fff; border: none; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; transition: background 0.2s; }
    .auth-btn:hover { background: #5c0000; }
    
    .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; }
    .toggle-link a { color: var(--text-red); font-weight: bold; text-decoration: none; cursor: pointer; }
    .toggle-link a:hover { text-decoration: underline; }

    footer { background: #4a0000; color: #ffcccc; text-align: center; padding: 20px 15px; font-size: 12.5px; border-top: 4px solid var(--bg-primary); margin-top: 50px; }
    footer a { color: var(--accent-gold); text-decoration: none; margin: 0 6px; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="container nav-flex">
      <a href="index.html" class="logo-link">
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='logo.png'">
        <span class="logo-text">Vedic Astro<span> & Vastu</span></span>
      </a>
      <ul class="nav-links" style="list-style: none; display: flex; align-items: center; gap: 6px;">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="consult.html">Consult</a></li>
        <li><a href="admin.html">Admin</a></li>
        <li><a href="consult.html" class="btn-book">Book Now</a></li>
      </ul>
    </div>
  </nav>

  <!-- AUTH SECTION -->
  <div class="container">
    <div class="auth-wrapper">
      
      <!-- LOGIN FORM -->
      <div id="loginSection">
        <h2>Client Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label>Email or Phone Number:</label>
            <input type="text" id="loginId" required placeholder="Enter your registered email or phone">
          </div>
          <div class="form-group">
            <label>Password:</label>
            <input type="password" id="loginPassword" required placeholder="Enter password">
          </div>
          <button type="submit" class="auth-btn">Login</button>
        </form>
        <div class="toggle-link">
          Don't have an account? <a onclick="switchForm('register')">Register here</a>
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerSection" style="display: none;">
        <h2>Create an Account</h2>
        <form id="registerForm">
          <div class="form-group">
            <label>Full Name:</label>
            <input type="text" id="regName" required placeholder="Enter your full name">
          </div>
          <div class="form-group">
            <label>Email Address:</label>
            <input type="email" id="regEmail" required placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" id="regPhone" required placeholder="Enter your phone number">
          </div>
          <div class="form-group">
            <label>Password:</label>
            <input type="password" id="regPassword" required placeholder="Create a password">
          </div>
          <button type="submit" class="auth-btn">Register</button>
        </form>
        <div class="toggle-link">
          Already have an account? <a onclick="switchForm('login')">Login here</a>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <p>© 2026 Vedic Astro & Vastu Services — Curated by Acharya Abhijit Das.</p>
  </footer>

  <script>
    function switchForm(type) {
      if (type === 'register') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('registerSection').style.display = 'block';
      } else {
        document.getElementById('registerSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
      }
    }

    // Register Form Submit
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const password = document.getElementById('regPassword').value;

      try {
        const response = await fetch('https://astro-website-haaz.onrender.com/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const result = await response.json();
        if (response.ok) {
          alert('Registration successful! Please login.');
          switchForm('login');
        } else {
          alert(result.message || 'Registration failed');
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Server connection error!');
      }
    });

    // Login Form Submit
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const loginId = document.getElementById('loginId').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('https://astro-website-haaz.onrender.com/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ loginId, password })
        });
        const result = await response.json();
        if (response.ok) {
          alert('Login successful!');
          localStorage.setItem('astro_logged_client', JSON.stringify(result.user));
          window.location.href = 'services.html';
        } else {
          alert(result.message || 'Invalid credentials');
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Server connection error!');
      }
    });
  </script>
</body>
</html>
