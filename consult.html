<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Consultation - Vedic Astro & Vastu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0;">
  
  <header style="background: #8b0000; color: white; padding: 15px; text-align: center;">
    <h2>Vedic Astro & Vastu - Consultation</h2>
    <p><a href="index.html" style="color: #ffeb3b; text-decoration: none;">Back to Home</a></p>
  </header>

  <div style="max-width: 600px; margin: 30px auto; padding: 25px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
    <h3 style="margin-top: 0; color: #333; text-align: center;">Book Your Consultation Session</h3>
    
    <form id="orderForm">
      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Full Name:</label>
        <input type="text" id="clientName" required placeholder="Enter your full name" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Phone Number:</label>
        <input type="tel" id="clientPhone" required placeholder="Enter your phone number" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Select Service Package:</label>
        <select id="servicePackage" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
          <option value="">-- Choose Service --</option>
          <option value="Astrology Consultation">Astrology Consultation</option>
          <option value="Vastu Analysis">Vastu Analysis</option>
          <option value="Numerology Report">Numerology Report</option>
        </select>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Amount (INR):</label>
        <input type="number" id="serviceAmount" required placeholder="Enter amount" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Payment UTR / Reference No:</label>
        <input type="text" id="utrRef" required placeholder="Enter UTR transaction ID" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Date of Birth & Time:</label>
        <input type="text" id="dobTime" required placeholder="DD/MM/YYYY, HH:MM AM/PM" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Birth Place:</label>
        <input type="text" id="birthPlace" required placeholder="City, State, Country" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold; color: #444;">Your Question / Query:</label>
        <textarea id="clientQuery" rows="4" placeholder="Write your specific query here..." style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"></textarea>
      </div>

      <button type="submit" style="width: 100%; padding: 12px; background: #8b0000; color: #fff; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px;">Submit Booking</button>
    </form>
  </div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const orderData = {
        clientName: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        service: document.getElementById('servicePackage').value,
        amount: document.getElementById('serviceAmount').value,
        utr: document.getElementById('utrRef').value,
        dobTime: document.getElementById('dobTime').value,
        birthPlace: document.getElementById('birthPlace').value,
        query: document.getElementById('clientQuery').value
      };

      try {
        const response = await fetch('https://astro-website-haaz.onrender.com/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        
        const result = await response.json();
        if (response.ok) {
          alert('Consultation booking submitted successfully!');
          document.getElementById('orderForm').reset();
        } else {
          alert(result.message || 'Failed to submit order.');
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Server connection error!');
      }
    });
  </script>
</body>
</html>
