<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Consultation - Vedic Astro & Vastu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
      <h2>Vedic Astro & Vastu</h2>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="consult.html" class="active">Consult</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <div class="container" style="max-width: 600px; margin: 30px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
    <h2>Book Your Consultation Session</h2>
    
    <form id="orderForm">
      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Full Name:</label>
        <input type="text" id="clientName" required placeholder="Enter your full name" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Phone Number:</label>
        <input type="tel" id="clientPhone" required placeholder="Enter your phone number" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Select Service Package:</label>
        <select id="servicePackage" required style="width: 100%; padding: 8px; box-sizing: border-box;">
          <option value="">-- Choose Service --</option>
          <option value="Astrology Consultation">Astrology Consultation</option>
          <option value="Vastu Analysis">Vastu Analysis</option>
          <option value="Numerology Report">Numerology Report</option>
        </select>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Amount (INR):</label>
        <input type="number" id="serviceAmount" required placeholder="Enter amount" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Payment UTR / Reference No:</label>
        <input type="text" id="utrRef" required placeholder="Enter UTR transaction ID" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Date of Birth & Time:</label>
        <input type="text" id="dobTime" required placeholder="DD/MM/YYYY, HH:MM AM/PM" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Birth Place:</label>
        <input type="text" id="birthPlace" required placeholder="City, State, Country" style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom: 5px; font-weight: bold;">Your Question / Query:</label>
        <textarea id="clientQuery" rows="4" placeholder="Write your specific query here..." style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
      </div>

      <button type="submit" style="width: 100%; padding: 10px; background: #8b0000; color: #fff; border: none; font-size: 16px; cursor: pointer; border-radius: 4px;">Submit Booking</button>
    </form>
  </div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const orderData = {
        clientName: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        service: document.getElementById('servicePackage').value,
        amount: document.getElementById('serviceAmount').value,
        utr: document.getElementById('utrRef').value,
        dobTime: document.getElementById('dobTime').value,
        birthPlace: document.getElementById('birthPlace').value,
        query: document.getElementById('clientQuery').value
      };

      try {
        const response = await fetch('https://astro-website-haaz.onrender.com/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });
        
        const result = await response.json();
        if (response.ok) {
          alert('Consultation booking submitted successfully!');
          document.getElementById('orderForm').reset();
        } else {
          alert(result.message || 'Failed to submit order.');
        }
      } catch (err) {
        console.error('Error:', err);
        alert('Server connection error!');
      }
    });
  </script>
</body>
</html>
